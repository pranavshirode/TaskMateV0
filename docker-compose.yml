services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: taskmate-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskmate_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-taskmate}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskmate} -d ${POSTGRES_DB:-taskmate}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---- FastAPI Backend ----
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: taskmate-api
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_NAME=${APP_NAME:-TaskMate API}
      - APP_VERSION=${APP_VERSION:-0.1.0}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-taskmate}:${POSTGRES_PASSWORD:-taskmate_dev_password}@postgres:5432/${POSTGRES_DB:-taskmate}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000"]}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    volumes:
      - ./apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ---- Next.js Frontend ----
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: taskmate-web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
    name: taskmate_postgres_data
