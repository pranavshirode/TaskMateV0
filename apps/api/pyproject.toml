[project]
name = "taskmate-api"
version = "0.1.0"
description = "TaskMate AI Backend API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "python-json-logger>=3.0.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "openai>=1.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["alembic", "evaluation"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["B008", "E501", "F821", "E402", "UP035", "N801", "SIM108", "SIM117", "UP007", "UP006", "N806", "N802", "N803", "W291", "W293", "W292"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
exclude = ["alembic/", "evaluation/"]

[[tool.mypy.overrides]]
module = [
    "app.agent.orchestrator",
    "app.agent.tools.requirements_tools",
    "app.agent.tools.registry",
    "app.ai.services.orchestrator",
    "app.ai.context.builder",
    "app.services.agent_execution",
    "app.services.task",
    "app.services.project",
    "app.services.client",
    "app.services.requirements_pipeline",
    "app.repositories.project",
    "app.repositories.base",
    "app.repositories.client",
    "app.repositories.github_integration",
    "app.repositories.repository",
    "app.repositories.task",
    "app.models.ai",
    "app.models.client",
    "app.models.project",
    "app.models.repository",
    "app.models.requirements",
    "app.models.task",
    "app.models.task_event",
    "app.models.user",
]
ignore_errors = true
